# Robô do Davi
name: Responder DMs do Instagram

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # a cada 15 min, fora da virada da hora
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responder-dm
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Responder DMs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_MIKEROSSBR2: ${{ secrets.IG_TOKEN_MIKEROSSBR2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python insta-autopost/dm_bot.py
