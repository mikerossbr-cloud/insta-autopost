name: Publicar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publicar posts que chegaram na hora
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}/posts', github.repository_owner, github.event.repository.name) }}
        run: python publish.py

      - name: Salvar status dos posts
        if: always()
        run: |
          git config user.name "robo-instagram"
          git config user.email "robo-instagram@users.noreply.github.com"
          mkdir -p posts
          git add posts
          git diff --cached --quiet || (git commit -m "Atualiza status dos posts" && git push)
